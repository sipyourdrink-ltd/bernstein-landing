name: ci

# Install, lint, typecheck, unit tests, production build. The build step
# is the one that matters most here: this site prerenders ~100 routes at
# build time, so a page that throws only fails at `next build` - never in
# `tsc`, and never in a unit test.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded runs only for PRs. A push-to-master run must not be
  # cancelled by the next merge landing seconds later: a cancelled run
  # shows grey, not red, so the earlier commit silently loses its check.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: lint · types · tests · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          # Matches the runtime in the Dockerfile. Building on a newer
          # major than production ships would let a syntax or API change
          # pass here and fail in the image.
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        # The retrieval index and the comparison dataset are supplied by
        # the host and are absent here; `scripts/prebuild.mjs` announces
        # each step it skips, so a genuinely missing step is visible in
        # the log rather than silently absent.
        run: npm run build
        env:
          # Nothing outbound from CI: the post-build search-engine ping
          # belongs to a deploy, not to a pull request.
          NEXT_TELEMETRY_DISABLED: "1"
