name: ci

# Install, lint, typecheck, unit tests, production build. The build step
# is the one that matters most here: this site prerenders ~100 routes at
# build time, so a page that throws only fails at `next build` - never in
# `tsc`, and never in a unit test.
#
# Two jobs, because they answer different questions. The test suite is
# TypeScript executed directly, which needs the type stripping added in
# Node 22.6, so it runs on the `.nvmrc` major. The build runs on the major
# the production image ships (`node:22-alpine`) - proving it on any other
# major would let a syntax or API change pass here and fail in the image.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded runs only for PRs. A push-to-master run must not be
  # cancelled by the next merge landing seconds later: a cancelled run
  # shows grey, not red, so the earlier commit silently loses its check.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: lint · types · tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          # `npm test` runs the .ts suites through Node's own type
          # stripping, which landed in 22.6. See the header note.
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

  build:
    name: production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          # The major the Dockerfile ships. Keep the two in step.
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build
        # The retrieval index and the comparison dataset are supplied by
        # the host and are absent here; `scripts/prebuild.mjs` announces
        # each step it skips, so a genuinely missing step is visible in
        # the log rather than silently absent.
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        # Nothing outbound from CI: `scripts/submit-indexnow.mjs` runs
        # through `postbuild` and returns early under GITHUB_ACTIONS, so
        # the search-engine ping stays a deploy step.

      - name: Generate and check llms.txt
        run: |
          PORT=3100 HOSTNAME=127.0.0.1 node .next/standalone/server.js &
          echo "$!" > "$RUNNER_TEMP/llms-server.pid"
          curl --fail --silent --show-error --retry 30 --retry-connrefused \
            --retry-delay 1 --retry-max-time 60 --max-time 2 \
            http://127.0.0.1:3100/api/health
          curl -fsS http://127.0.0.1:3100/llms.txt -o llms.txt
          test -s llms.txt
          for url in \
            'https://bernstein.run/cli-quickstart' \
            'https://mcp.bernstein.run/verify' \
            'https://github.com/sipyourdrink-ltd/bernstein/tree/main/docs' \
            'https://deepwiki.com/sipyourdrink-ltd/bernstein'; do
            grep -Fq "$url" llms.txt
          done
          duplicates=$(grep -oE 'https?://[^) ]+' llms.txt | sort | uniq -d)
          test -z "$duplicates"

      - name: Upload llms.txt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: llms-txt
          path: llms.txt
          if-no-files-found: error

      - name: Stop llms.txt server
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/llms-server.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/llms-server.pid")"
          fi

      - name: Blog freeze
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        # Remove this step in the same commit that lifts the freeze.
        run: |
          git fetch --depth=1 origin "$BASE_REF"
          git diff --exit-code FETCH_HEAD -- content/blog
