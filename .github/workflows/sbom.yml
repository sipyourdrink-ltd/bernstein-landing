name: sbom

# Publish a CycloneDX software bill of materials for the production
# dependency tree on every push to master, so "what shipped in that
# image" is answerable from the repository rather than from a running
# container.

on:
  push:
    branches: [master]
    paths:
      - "package.json"
      - "package-lock.json"
  schedule:
    - cron: "29 9 1 * *"  # Monthly, 1st at 09:29 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom:
    name: generate cyclonedx sbom
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: 22
          cache: npm

      - name: Install production dependencies
        run: npm ci --omit=dev --prefer-offline --no-audit --no-fund

      - name: Generate SBOM
        run: npx --yes @cyclonedx/cyclonedx-npm@^6 --omit dev --output-file sbom.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 90
