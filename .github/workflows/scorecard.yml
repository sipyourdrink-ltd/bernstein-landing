name: scorecard (supply-chain posture)

# OpenSSF Scorecard rates the repository's own supply-chain hygiene:
# branch protection, pinned dependencies, token permissions, published
# artefacts. Results go to Code Scanning; the badge in the README reads
# from the public API.

on:
  branch_protection_rule:
  push:
    branches: [master]
  schedule:
    - cron: "41 5 * * 3"  # Weekly, Wednesday 05:41 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e  # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishing lets the README badge resolve without a token.
          publish_results: true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v4
        with:
          sarif_file: results.sarif
