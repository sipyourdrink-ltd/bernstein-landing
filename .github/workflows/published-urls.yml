name: published urls

# Published identifiers must resolve. The bernstein package writes
# https://bernstein.run/ URLs into what it signs and exports (predicate
# types, schema $id values, namespaces, catalog URLs); verifiers and tools
# dereference them. This fetches every URL in data/published-urls.json from
# the live site and fails on anything that does not resolve as declared.
#
# Scheduled and on demand rather than per PR: the site is deployed by hand,
# so a PR cannot change what the live site answers. The per-PR proof that
# the build serves every entry is tests/published-urls.test.ts.

on:
  schedule:
    - cron: "41 6 * * *"  # Daily, 06:41 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: resolve published urls
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version-file: .nvmrc

      - name: Check
        run: node scripts/check-published-urls.mjs
