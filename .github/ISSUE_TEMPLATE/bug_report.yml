name: Bug report
description: Something on the site is broken, wrong, or does not render.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For bugs in the orchestrator itself, use the
        [bernstein tracker](https://github.com/sipyourdrink-ltd/bernstein/issues).
        This tracker is for the website.

  - type: input
    id: url
    attributes:
      label: URL
      description: The page it happens on.
      placeholder: https://bernstein.run/...
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The shortest path from a fresh tab to the problem.
      placeholder: |
        1. open ...
        2. click ...
        3. the ... renders empty
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: Browser and OS
      placeholder: Firefox 141 on Fedora 42
    validations:
      required: false
